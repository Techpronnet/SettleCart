# ==============================================================================
# SettleCart Nginx Configuration - Reverse Proxy
# Supports direct EC2 Server IP access (HTTP :80) with full API, WebSocket,
# SSE streaming, and ACME challenge preparation.
# ==============================================================================

# --- Port 80: Direct HTTP Reverse Proxy (Active for Server IP) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Core Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Payload Limits & Buffers (supports image & document uploads)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Proxy Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Shared Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Let's Encrypt ACME challenge endpoint (ready for when domain is linked)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Realtime WebSockets (/api/v1/ws/orders/...)
    location ~* ^/api/v[0-9]+/ws/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Realtime Server-Sent Events (SSE: /api/v1/orders/.../live-tracking)
    location ~* /live-tracking$ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Default API, Docs & Health Check Reverse Proxy
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}


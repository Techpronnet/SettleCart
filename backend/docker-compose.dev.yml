# ==============================================================================
# SettleCart Local Development Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Or: docker compose -f docker-compose.dev.yml up
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV: "true"
    image: settlecart-backend:dev
    container_name: settlecart-api-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://settlecart:settlecart@db:5432/settlecart
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: settlecart-db-dev
    environment:
      - POSTGRES_USER=settlecart
      - POSTGRES_PASSWORD=settlecart
      - POSTGRES_DB=settlecart
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlecart -d settlecart"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: settlecart-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

  celery_worker:
    image: settlecart-backend:dev
    container_name: settlecart-celery-worker-dev
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://settlecart:settlecart@db:5432/settlecart
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - internal_net
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: settlecart-backend:dev
    container_name: settlecart-celery-beat-dev
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://settlecart:settlecart@db:5432/settlecart
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - internal_net
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata_dev:
  redis_data_dev:

# ==============================================================================
# SettleCart Production Docker Compose
# Architecture: Nginx (80/443) -> FastAPI (8000 internal) -> Neon PostgreSQL (TLS)
#               + Internal Redis & Celery Background Workers
# ==============================================================================

services:
  # --- Reverse Proxy & SSL Termination ---
  nginx:
    image: nginx:alpine
    container_name: settlecart-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    networks:
      - internal_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Let's Encrypt SSL Auto-Renewal ---
  certbot:
    image: certbot/certbot:latest
    container_name: settlecart-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - internal_net

  # --- Core FastAPI Application ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV: "false"
    image: settlecart-backend:latest
    container_name: settlecart-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - internal_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- Internal Redis (No Public Exposure) ---
  redis:
    image: redis:7-alpine
    container_name: settlecart-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Background Task Worker ---
  celery_worker:
    image: settlecart-backend:latest
    container_name: settlecart-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    networks:
      - internal_net
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Scheduled Task Beat ---
  celery_beat:
    image: settlecart-backend:latest
    container_name: settlecart-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    networks:
      - internal_net
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  internal_net:
    driver: bridge

volumes:
  redis_data:
  nginx_logs:

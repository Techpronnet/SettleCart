name: Backend CI/CD & Production Deployment

on:
  pull_request:
    branches:
      - production
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  push:
    branches:
      - production
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Automated Unit & Integration Tests
  # ============================================================================
  test:
    name: Automated Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Test Suite
        env:
          APP_ENV: testing
          DEBUG: false
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: test-secret-key-for-github-actions-ci-pipeline
          JWT_SECRET_KEY: test-jwt-secret-key-for-github-actions-ci
        run: |
          cd backend
          pytest -v tests/

  # ============================================================================
  # 2. Code Quality & Formatting (Ruff)
  # ============================================================================
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff>=0.8,<1.0

      - name: Run Ruff Lint Checks
        run: ruff check backend/

      - name: Run Ruff Format Verification
        run: ruff format --check backend/

  # ============================================================================
  # 3. Security Auditing (Bandit & pip-audit)
  # ============================================================================
  security:
    name: Security Vulnerability Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Security Tools
        run: pip install bandit>=1.7,<2.0 pip-audit>=2.7,<3.0

      - name: Static Code Analysis (Bandit)
        run: |
          echo "Running Bandit SAST on backend/app..."
          bandit -r backend/app -ll -ii

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          echo "Auditing production dependencies with pip-audit..."
          pip-audit -r backend/requirements.txt

  # ============================================================================
  # 4. Docker Build & Image Vulnerability Scan
  # ============================================================================
  docker-build:
    name: Docker Build & Vulnerability Scan
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: |
          docker build \
            --tag settlecart-backend:ci \
            --file backend/Dockerfile \
            --build-arg DEV=false \
            backend/

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: 'settlecart-backend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # 5. Automated Deployment to AWS EC2 via SSH
  # ============================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: [docker-build]
    # Deploy exclusively when PR is merged into production branch or manually dispatched
    if: (github.event_name == 'push' && github.ref == 'refs/heads/production') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/home/${{ secrets.EC2_USER }}/settlecart/backend"
            echo "--> Navigating to application directory: $APP_DIR"
            cd "$APP_DIR"
            
            echo "--> Ensuring scripts are executable..."
            chmod +x scripts/deploy.sh scripts/rollback.sh scripts/init-letsencrypt.sh
            
            echo "--> Running production deployment script..."
            ./scripts/deploy.sh
